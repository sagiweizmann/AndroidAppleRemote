name: Release

# Tag a commit to cut a release:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # AGP 8.7's bundled lint cannot parse a Java 25 version string, so stay on 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Vendor Companion Link protocol
        run: ./scripts/vendor-companion-protocol.sh

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          # AGP emits app-release-unsigned.apk when no signing config applied.
          if [ ! -f "$APK" ]; then
            echo "::error::$APK missing - the build produced an unsigned APK."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Name the artifact after the tag
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          NAME="AndroidAppleRemote-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME" | tee "$NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.name }}
            ${{ steps.pkg.outputs.name }}.sha256
