name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor Companion Link protocol
        run: |
          rm -rf /tmp/atvr4samsung
          git clone --depth 1 https://github.com/vb3/atvr4samsung.git /tmp/atvr4samsung
          mkdir -p app/src/main/python/atvr4samsung/companion
          cp -R /tmp/atvr4samsung/src/atvr4samsung/companion/protocol app/src/main/python/atvr4samsung/companion/
          touch app/src/main/python/atvr4samsung/__init__.py
          touch app/src/main/python/atvr4samsung/companion/__init__.py
          mkdir -p app/src/main/assets/licenses
          cp /tmp/atvr4samsung/LICENSE app/src/main/assets/licenses/atvr4samsung-LICENSE.txt
          cp /tmp/atvr4samsung/src/atvr4samsung/companion/protocol/LICENSE-companion-base.md app/src/main/assets/licenses/LICENSE-companion-base.md

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidAppleRemote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
